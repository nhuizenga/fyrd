# Publishes a GitHub Release for each new plugin version: on a push to main whose .claude-plugin/plugin.json version
# has no release yet, builds the fyrd dotnet tool (the console) and the plugin zip and attaches both to a release
# tagged and titled v<version>. A push whose version is already released does nothing. See docs/releases.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for a new version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      exists: ${{ steps.exists.outputs.exists }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: ./scripts/release/plugin-version.ps1
      - id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: ./scripts/release/release-exists.ps1 -Tag $env:TAG

  release:
    name: Build and publish ${{ needs.check.outputs.tag }}
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Test the release scripts
        run: ./scripts/release/invoke-tests.ps1
      - id: tool
        name: Build the fyrd tool package
        run: ./scripts/release/build-tool-package.ps1 -OutDir out
      - id: zip
        name: Build the plugin zip
        run: ./scripts/release/build-plugin-zip.ps1 -OutDir out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          TOOL: ${{ steps.tool.outputs.path }}
          ZIP: ${{ steps.zip.outputs.path }}
        run: ./scripts/release/publish-release.ps1 -Tag $env:TAG -Assets $env:TOOL, $env:ZIP
